[project]
name = "deck-composer"
version = "0.1.0"
description = "Compose Commander tables from a ManaBox collection: deterministic tools behind a Claude Code skill."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
deck-composer = "deck_composer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "pyright>=1.1.400",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: reaches the real Scryfall API; deselected by default"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
